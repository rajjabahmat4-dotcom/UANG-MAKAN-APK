
name: Build APK KP2251

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Android project
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: File ZIP proyek tidak ditemukan."
            exit 1
          fi

          mkdir -p android-project
          unzip -oq "$ZIP" -d android-project

          echo "Isi proyek:"
          find android-project -maxdepth 4 -type f | head -100

          GRADLEW=$(find android-project -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: File gradlew tidak ditemukan dalam ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KP2251-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
