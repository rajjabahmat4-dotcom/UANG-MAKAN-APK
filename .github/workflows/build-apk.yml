
name: Build APK KP2251

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: findzip
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP proyek tidak ditemukan di folder utama."
            exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "ZIP ditemukan: $ZIP"

      - name: Extract project
        run: |
          mkdir -p android-project
          unzip -q "${{ steps.findzip.outputs.zip }}" -d android-project
          echo "Isi ZIP:"
          find android-project -maxdepth 4 -type f | head -100

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          GRADLEW=$(find android-project -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "GAGAL: file gradlew tidak ditemukan di ZIP."
            echo "ZIP harus berisi proyek Android lengkap."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KP2251-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
